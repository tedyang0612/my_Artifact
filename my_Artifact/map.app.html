            {

            {
                id: "yil-taipingshan",
                title: "太平山國家森林遊樂區",

                lat: 24.4947,

                rating: 4.7,
                hours: "06:00 - 20:00",
                ticket: "NT$ 200",
                address: "宜蘭縣大同鄉太平巷 58-1 號",
                image: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80",
                desc: "擁有見晴懷古步道（獲選全球最美步道之一）、鳩之澤溫泉與翠峰湖，四季雲霧繚繞，高山森林生態極為豐富。"
            },
            {
                id: "pen-ph",
                title: "澎湖跨海大橋",
                region: "離島",
                county: "澎湖縣",
                category: "自然風光",
                lat: 23.6496,
                lng: 119.5583,
                rating: 4.5,
                hours: "全天開放",
                ticket: "免費參觀",
                address: "澎湖縣白沙鄉通梁村",
                image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80",
                desc: "連接白沙與西嶼兩島的宏偉跨海大橋，橫跨凶險的海流吼門，沿途海天一色，為澎湖群島標誌性地點。"
            }
        ];

        // Regions and Categories List for Filter Tabs
        const regions = ["全部", "北部", "中部", "南部", "東部", "離島"];
        const categories = ["全部主題", "自然風光", "歷史文化", "城市地標", "藝術文創", "休閒農場"];

        // Category Color Mapping
        const categoryColors = {
            "自然風光": { bg: "bg-emerald-100", text: "text-emerald-800", badge: "bg-emerald-500", pin: "#10b981", icon: "fa-tree" },
            "歷史文化": { bg: "bg-amber-100", text: "text-amber-800", badge: "bg-amber-500", pin: "#f59e0b", icon: "fa-landmark" },
            "城市地標": { bg: "bg-blue-100", text: "text-blue-800", badge: "bg-blue-500", pin: "#3b82f6", icon: "fa-building" },
            "藝術文創": { bg: "bg-purple-100", text: "text-purple-800", badge: "bg-purple-500", pin: "#a855f7", icon: "fa-palette" },
            "休閒農場": { bg: "bg-lime-100", text: "text-lime-800", badge: "bg-lime-600", pin: "#65a30d", icon: "fa-tractor" }
        };

        // Global Application State
        let map = null;
        let markersGroup = null;
        let selectedRegion = "全部";
        let selectedCategory = "全部主題";
        let searchQuery = "";
        let favorites = JSON.parse(localStorage.getItem('tw_travel_favs')) || ["tpe-101", "nan-sml"];
        let activeSpotId = null;

        // Initialize App on DOM Loaded
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderFilterButtons();
            updateFilteredSpots();
            setupEventListeners();
            updateFavoriteBadge();
        });

        // Initialize Leaflet Map Centered on Taiwan
        function initMap() {
            // Taiwan Center Coordinates
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([23.8, 120.95], 7.5);

            // OpenStreetMap Tiles with smooth styling
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                minZoom: 6
            }).addTo(map);

            // Add Zoom Control to Top Right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Layer group for spot markers
            markersGroup = L.layerGroup().addTo(map);
        }

        // Render Region and Category Filter Chips
        function renderFilterButtons() {
            const regionContainer = document.getElementById('regionFilters');
            regionContainer.innerHTML = regions.map(r => `
                <button onclick="setRegion('${r}')" class="px-3 py-1 rounded-full text-xs font-semibold transition ${selectedRegion === r ? 'bg-brand-600 text-white shadow-sm' : 'bg-slate-200/70 hover:bg-slate-200 text-slate-700'}">
                    ${r}
                </button>
            `).join('');

            const categoryContainer = document.getElementById('categoryFilters');
            categoryContainer.innerHTML = categories.map(c => `
                <button onclick="setCategory('${c}')" class="px-3 py-1 rounded-full text-xs font-semibold transition ${selectedCategory === c ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-200/70 hover:bg-slate-200 text-slate-700'}">
                    ${c}
                </button>
            `).join('');
        }

        // Set Region Filter
        window.setRegion = function(region) {
            selectedRegion = region;
            renderFilterButtons();
            updateFilteredSpots();
        }

        // Set Category Filter
        window.setCategory = function(cat) {
            selectedCategory = cat;
            renderFilterButtons();
            updateFilteredSpots();
        }

        // Main Filtering Function
        function getFilteredAttractions() {
            return attractions.filter(spot => {
                const matchRegion = selectedRegion === "全部" || spot.region === selectedRegion;
                const matchCategory = selectedCategory === "全部主題" || spot.category === selectedCategory;
                const matchSearch = searchQuery === "" || 
                    spot.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    spot.county.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    spot.desc.toLowerCase().includes(searchQuery.toLowerCase());

                return matchRegion && matchCategory && matchSearch;
            });
        }

        // Update Both Map Markers and Sidebar Spot List
        function updateFilteredSpots() {
            const filtered = getFilteredAttractions();
            
            // Update counter
            document.getElementById('resultCount').textContent = filtered.length;

            // Update List UI
            renderSpotList(filtered);

            // Update Map Markers
            renderMapMarkers(filtered);
        }

        // Render Cards in Sidebar
        function renderSpotList(items) {
            const listContainer = document.getElementById('spotList');
            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 px-4">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400 mb-3">
                            <i class="fa-solid fa-compass-slash text-xl"></i>
                        </div>
                        <p class="text-sm font-semibold text-slate-700">找不到符合條件的景點</p>
                        <p class="text-xs text-slate-400 mt-1">嘗試調整搜尋關鍵字或清除篩選條件</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = items.map(spot => {
                const catStyle = categoryColors[spot.category] || { bg: "bg-slate-100", text: "text-slate-800" };
                const isFav = favorites.includes(spot.id);

                return `
                    <div id="card-${spot.id}" onclick="focusSpot('${spot.id}')" class="group p-3 rounded-xl border border-slate-200/80 hover:border-brand-500 bg-white hover:shadow-md transition cursor-pointer flex gap-3 relative overflow-hidden">
                        <!-- Spot Image -->
                        <div class="w-24 h-24 rounded-lg overflow-hidden flex-none bg-slate-100 relative">
                            <img src="${spot.image}" alt="${spot.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        </div>

                        <!-- Spot Info -->
                        <div class="flex-1 flex flex-col justify-between py-0.5">
                            <div>
                                <div class="flex items-center justify-between gap-1 mb-1">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${catStyle.bg} ${catStyle.text}">${spot.category}</span>
                                    <span class="text-xs text-amber-500 font-bold flex items-center gap-0.5">
                                        <i class="fa-solid fa-star text-[10px]"></i> ${spot.rating}
                                    </span>
                                </div>
                                <h3 class="font-bold text-slate-900 text-sm group-hover:text-brand-600 transition line-clamp-1">${spot.title}</h3>
                                <p class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${spot.county} · ${spot.region}</p>
                            </div>

                            <div class="flex items-center justify-between text-xs pt-2">
                                <button onclick="event.stopPropagation(); openDetailModal('${spot.id}')" class="text-slate-500 hover:text-brand-600 font-medium">
                                    詳細資料 <i class="fa-solid fa-chevron-right text-[10px]"></i>
                                </button>
                                <button onclick="event.stopPropagation(); toggleFavorite('${spot.id}')" class="p-1 text-slate-400 hover:text-rose-500 transition">
                                    <i class="${isFav ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart text-base"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Leaflet Markers
        function renderMapMarkers(items) {
            markersGroup.clearLayers();

            items.forEach(spot => {
                const style = categoryColors[spot.category] || { pin: "#16a34a", icon: "fa-map-pin" };

                // Custom Leaflet DivIcon
                const customIcon = L.divIcon({
                    className: 'custom-pin-wrapper',
                    html: `
                        <div class="custom-pin w-8 h-8 rounded-full" style="background-color: ${style.pin}">
                            <i class="fa-solid ${style.icon} text-xs"></i>
                        </div>
                    `,
                    iconSize: [32, 32],
                    iconAnchor: [16, 32],
                    popupAnchor: [0, -32]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });

                // Popup content
                const popupHtml = `
                    <div class="w-48">
                        <img src="${spot.image}" class="w-full h-24 object-cover rounded-lg mb-2">
                        <h4 class="font-bold text-slate-900 text-sm line-clamp-1">${spot.title}</h4>
                        <p class="text-xs text-slate-500 mb-2">${spot.county}</p>
                        <button onclick="openDetailModal('${spot.id}')" class="w-full py-1.5 bg-brand-600 text-white rounded-lg text-xs font-semibold hover:bg-brand-700 transition">
                            查看景點詳情
                        </button>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                marker.addTo(markersGroup);

                // Store reference
                spot.markerRef = marker;
            });
        }

        // Focus Map & Scroll to Spot
        window.focusSpot = function(id) {
            const spot = attractions.find(s => s.id === id);
            if (!spot) return;

            activeSpotId = id;

            // Pan Map
            map.flyTo([spot.lat, spot.lng], 12, { duration: 1.2 });
            
            if (spot.markerRef) {
                setTimeout(() => spot.markerRef.openPopup(), 600);
            }

            // Scroll card into view in sidebar if on mobile/desktop
            const cardEl = document.getElementById(`card-${id}`);
            if (cardEl) {
                cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Modal Handlers
        window.openDetailModal = function(id) {
            const spot = attractions.find(s => s.id === id);
            if (!spot) return;

            const modal = document.getElementById('detailModal');
            const card = document.getElementById('detailModalCard');
            const catStyle = categoryColors[spot.category] || { badge: 'bg-brand-500' };

            document.getElementById('modalImage').src = spot.image;
            document.getElementById('modalTitle').textContent = spot.title;
            document.getElementById('modalRegion').textContent = `${spot.region} · ${spot.county}`;
            document.getElementById('modalDescription').textContent = spot.desc;
            document.getElementById('modalHours').textContent = spot.hours;
            document.getElementById('modalTicket').textContent = spot.ticket;
            document.getElementById('modalAddress').textContent = spot.address;
            document.getElementById('modalRating').textContent = spot.rating;

            const badgeEl = document.getElementById('modalCategoryBadge');
            badgeEl.textContent = spot.category;

            // Google Maps Link
            document.getElementById('modalGoogleMaps').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.title + ' ' + spot.address)}`;

            // Fav Button State in Modal
            const favBtn = document.getElementById('modalFavBtn');
            const isFav = favorites.includes(spot.id);

            favBtn.className = `flex-1 py-2.5 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 shadow-md ${
                isFav ? 'bg-rose-500 hover:bg-rose-600 text-white shadow-rose-500/20' : 'bg-brand-600 hover:bg-brand-700 text-white shadow-brand-500/20'
            }`;
            favBtn.innerHTML = `<i class="fa-solid fa-heart"></i> <span>${isFav ? '從收藏移除' : '加入我的收藏'}</span>`;
            favBtn.onclick = () => {
                toggleFavorite(spot.id);
                openDetailModal(spot.id); // Refresh modal button
            };

            // Show Modal with Animation
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            const card = document.getElementById('detailModalCard');

            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Favorite Toggle & LocalStorage Sync
        window.toggleFavorite = function(id) {
            const spot = attractions.find(s => s.id === id);
            if (!spot) return;

            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast(`已從收藏移除「${spot.title}」`, "fa-trash-can", "text-rose-400");
            } else {
                favorites.push(id);
                showToast(`已成功收藏「${spot.title}」`, "fa-heart", "text-rose-500");
            }

            localStorage.setItem('tw_travel_favs', JSON.stringify(favorites));
            updateFavoriteBadge();
            updateFilteredSpots();
            renderItineraryList();
        }

        function updateFavoriteBadge() {
            document.getElementById('favoriteBadge').textContent = favorites.length;
        }

        // Favorites / Itinerary Drawer Handlers
        function openItineraryDrawer() {
            renderItineraryList();
            document.getElementById('itineraryDrawer').classList.remove('translate-x-full');
        }

        function closeItineraryDrawer() {
            document.getElementById('itineraryDrawer').classList.add('translate-x-full');
        }

        function renderItineraryList() {
            const container = document.getElementById('itineraryList');
            const favSpots = attractions.filter(s => favorites.includes(s.id));

            if (favSpots.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-regular fa-heart text-4xl mb-3 block opacity-50"></i>
                        <p class="text-sm font-medium">尚未新增任何景點至收藏</p>
                        <p class="text-xs mt-1">點擊景點卡片上的愛心按鈕即可加入行程規劃</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = favSpots.map((spot, index) => `
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="w-6 h-6 rounded-full bg-brand-100 text-brand-700 font-bold text-xs flex items-center justify-center flex-none">${index + 1}</span>
                        <div class="min-w-0">
                            <h4 class="font-bold text-slate-900 text-sm truncate">${spot.title}</h4>
                            <p class="text-xs text-slate-500">${spot.county} · ${spot.category}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 flex-none">
                        <button onclick="focusSpot('${spot.id}'); closeItineraryDrawer()" title="在地圖查看" class="p-2 text-slate-500 hover:text-brand-600">
                            <i class="fa-solid fa-location-dot"></i>
                        </button>
                        <button onclick="toggleFavorite('${spot.id}')" title="刪除" class="p-2 text-slate-400 hover:text-rose-500">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Toast Message Utility
        function showToast(msg, iconClass = "fa-circle-check", iconColor = "text-brand-500") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass} ${iconColor}`;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Event Listeners Setup
        function setupEventListeners() {
            // Search Input listener
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                updateFilteredSpots();
            });

            // Mobile Search Input listener
            const mobileSearchInput = document.getElementById('mobileSearchInput');
            mobileSearchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                updateFilteredSpots();
            });

            // Mobile Search Toggle
            document.getElementById('mobileSearchBtn').addEventListener('click', () => {
                const container = document.getElementById('mobileSearchContainer');
                container.classList.toggle('hidden');
            });

            // Reset Filter Button
            document.getElementById('resetFiltersBtn').addEventListener('click', () => {
                selectedRegion = "全部";
                selectedCategory = "全部主題";
                searchQuery = "";
                searchInput.value = "";
                mobileSearchInput.value = "";
                renderFilterButtons();
                updateFilteredSpots();
                map.flyTo([23.8, 120.95], 7.5);
            });

            // Recenter Map Button
            document.getElementById('recenterMapBtn').addEventListener('click', () => {
                map.flyTo([23.8, 120.95], 7.5);
            });

            // Modal Closes
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') closeModal();
            });

            // Itinerary Drawer
            document.getElementById('openItineraryBtn').addEventListener('click', openItineraryDrawer);
            document.getElementById('closeItineraryBtn').addEventListener('click', closeItineraryDrawer);
            document.getElementById('clearItineraryBtn').addEventListener('click', () => {
                if (favorites.length === 0) return;
                favorites = [];
                localStorage.setItem('tw_travel_favs', JSON.stringify(favorites));
                updateFavoriteBadge();
                updateFilteredSpots();
                renderItineraryList();
                showToast("已清空所有行程收藏", "fa-trash-can", "text-rose-400");
            });
        }
    </script>
</body>
</html>
